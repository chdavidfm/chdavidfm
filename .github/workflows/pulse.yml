name: pulse

# Keeps the "Recent" block of the profile honest without a third-party widget.
# One row per public repository: the release it last cut, or the last commit
# that was not housekeeping. Nothing is written unless the file actually moved.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Rewrite the Recent block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pulse.mjs

      - name: Commit only if it actually changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Nothing moved this run."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "pulse: refresh recent activity" -- README.md
          git push
